<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🧩 LABIRINTO LÓGICO 3D - Puzzle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }
        
        /* UI Principal */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Header com informações */
        .game-header {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: auto;
        }
        
        .info-card {
            background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(0,0,0,0.7));
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px 25px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            min-width: 150px;
        }
        
        .info-label {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }
        
        .level-value {
            font-size: 24px;
            color: #ff6b6b;
        }
        
        /* Mensagens do jogo */
        .message-area {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }
        
        .game-message {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid #ffd700;
            white-space: nowrap;
            animation: pulse 1s ease-out;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Objetivo */
        .objective {
            position: absolute;
            top: 120px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 15px;
            border-left: 3px solid #ffd700;
            pointer-events: auto;
        }
        
        .objective p {
            color: white;
            font-size: 12px;
            margin: 2px 0;
        }
        
        .objective .title {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        /* Controles */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 11px;
            color: #ccc;
            font-family: monospace;
            pointer-events: auto;
        }
        
        .controls span {
            color: #ffd700;
            font-weight: bold;
        }
        
        /* Botão reiniciar */
        .reset-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            pointer-events: auto;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        
        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        
        /* Partículas de sucesso */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            position: absolute;
            animation: confettiFall 2s ease-out forwards;
            pointer-events: none;
        }
        
        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* Loading */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10000;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 20px;
        }
        
        .loader {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .loader-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            animation: loading 1s ease-out forwards;
        }
        
        @keyframes loading {
            to { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="loading">
        <h2>🧩 CARREGANDO LABIRINTO</h2>
        <div class="loader">
            <div class="loader-fill"></div>
        </div>
        <p style="margin-top: 10px;">Construindo os puzzles...</p>
    </div>

    <div id="ui" style="display: none;">
        <div class="game-header">
            <div class="info-card">
                <div class="info-label">🎯 OBJETIVO</div>
                <div class="info-value" id="objective-counter">0/3</div>
            </div>
            <div class="info-card">
                <div class="info-label">🌟 NÍVEL</div>
                <div class="info-value level-value" id="level-display">1</div>
            </div>
            <div class="info-card">
                <div class="info-label">⏱️ TEMPO</div>
                <div class="info-value" id="timer-display">00:00</div>
            </div>
        </div>
        
        <div class="objective">
            <div class="title">📋 MISSÃO ATUAL</div>
            <p id="objective-text">Ative todos os botões e chegue à saída!</p>
        </div>
        
        <div class="controls">
            🎮 <span>WASD/SETAS</span> = Movimento | <span>R</span> = Reiniciar nível
        </div>
        
        <button class="reset-btn" id="reset-btn">🔄 REINICIAR NÍVEL</button>
        
        <div class="message-area" id="message-area"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module" src="main.js"></script>
</body>
</html>
